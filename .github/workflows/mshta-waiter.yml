name: MSHTA Waiter

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: mshta-waiter
  cancel-in-progress: true

jobs:
  run-waiter:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Locate or install Debugging Tools for Windows
        shell: pwsh
        run: |
          $cdb = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $cdb) {
            Invoke-WebRequest "https://go.microsoft.com/fwlink/?linkid=2289980" -OutFile "$env:RUNNER_TEMP\winsdksetup.exe"
            Start-Process "$env:RUNNER_TEMP\winsdksetup.exe" -ArgumentList "/features OptionId.WindowsDesktopDebuggers /quiet /norestart" -Wait
            $cdb = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction Stop | Select-Object -First 1
          }
          $cdb.DirectoryName | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run Windows waiters
        shell: pwsh
        env:
          BRIDGE: ${{ vars.BRIDGE || 'https://bridge.smokestack.workers.dev' }}
        run: |
          $mshta = Start-Process node -ArgumentList "waiters/mshta/waiter.js" -NoNewWindow -PassThru
          $cdb = Start-Process node -ArgumentList "waiters/cdb/waiter.js" -NoNewWindow -PassThru
          Wait-Process -Id $mshta.Id, $cdb.Id
