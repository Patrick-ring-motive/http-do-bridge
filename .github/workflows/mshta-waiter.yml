name: MSHTA Waiter

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: mshta-waiter
  cancel-in-progress: true

jobs:
  run-waiter:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run MSHTA waiter
        env:
          BRIDGE: ${{ vars.BRIDGE || 'https://bridge.smokestack.workers.dev' }}
        run: mshta.exe "$PWD\waiters\mshta\waiter.hta"
