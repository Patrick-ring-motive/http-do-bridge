name: Waiter

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: waiter
  cancel-in-progress: true

jobs:
  run-waiter:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run waiter
        env:
          BRIDGE: ${{ vars.BRIDGE || 'https://bridge.smokestack.workers.dev' }}
        run: node waiters/nodejs/index.js
