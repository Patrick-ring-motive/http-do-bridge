<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Node.js Runner</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: #0d1117;
      color: #e6edf3;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    main { width: min(1100px, 100%); margin: auto; padding: 24px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    h1 { margin: 0; font: 600 20px/1.4 system-ui, sans-serif; }
    button, input, textarea, pre { border: 1px solid #30363d; border-radius: 6px; }
    button { padding: 9px 18px; background: #238636; color: white; font-weight: 600; cursor: pointer; }
    button:hover { background: #2ea043; }
    button:disabled { cursor: wait; opacity: .65; }
    label { display: block; margin: 12px 0 6px; color: #8b949e; font: 13px system-ui, sans-serif; }
    input, textarea, pre { width: 100%; background: #161b22; color: inherit; }
    input { padding: 10px 12px; }
    .editor-shell { position: relative; min-height: 55vh; }
    #editor, #highlight {
      position: absolute;
      inset: 0;
      min-height: 55vh;
      margin: 0;
      padding: 14px;
      overflow: auto;
      border: 1px solid #30363d;
      border-radius: 6px;
      resize: none;
      white-space: pre-wrap;
      overflow-wrap: normal;
      font: inherit;
      line-height: 1.5;
      tab-size: 2;
    }
    #highlight { pointer-events: none; color: #e6edf3; }
    #editor { background: transparent; color: transparent; caret-color: white; -webkit-text-fill-color: transparent; }
    #editor::selection { background: #264f78; }
    pre { min-height: 120px; margin: 0; padding: 14px; overflow: auto; white-space: pre-wrap; line-height: 1.5; }
    .color-star { color: cornflowerblue; }
    .color-curly { color: #ff79c6; }
    .color-square { color: #ba7dff; }
    .color-paren { color: orange; }
    .color-number { color: deepskyblue; }
    .color-symbol { color: #00ff00; }
    #status { min-height: 20px; color: #8b949e; font: 13px system-ui, sans-serif; }
    .error { color: red !important; }
    .warning { color: yellow; font: 13px/1.4 system-ui, sans-serif; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Node.js Runner</h1>
      <button id="run" type="button">Run</button>
    </header>

    <p class="warning">Code runs on the configured remote runner. Do not expose an unauthenticated runner to untrusted users.</p>

    <label for="endpoint">Cloudflare runner endpoint</label>
    <input id="endpoint" type="url" value="https://bridge.smokestack.workers.dev" spellcheck="false">

    <label for="editor">JavaScript</label>
    <div class="editor-shell">
      <pre id="highlight" aria-hidden="true"></pre>
      <textarea id="editor" spellcheck="false">console.log("Hello from Node.js", process.version);</textarea>
    </div>

    <label for="output">Output</label>
    <div id="status" role="status" aria-live="polite"></div>
    <pre id="output" aria-live="polite"></pre>
  </main>

  <script>
    const endpoint = document.querySelector("#endpoint");
    const editor = document.querySelector("#editor");
    const highlight = document.querySelector("#highlight");
    const output = document.querySelector("#output");
    const status = document.querySelector("#status");
    const runButton = document.querySelector("#run");
    const colorPattern = /([*•]+)|([{}‘’']+)|([\[\]“”"]+)|([()]+)|(\d+)|([^a-zA-Z0-9\s*•{}‘’'\[\]“”"()]+)/gu;
    const colorClasses = ["color-star", "color-curly", "color-square", "color-paren", "color-number", "color-symbol"];

    const escapeHtml = text => text.replace(/[&<>]/g, character => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;"
    })[character]);

    const colorCode = code => {
      let result = "";
      let offset = 0;
      for (const match of code.matchAll(colorPattern)) {
        result += escapeHtml(code.slice(offset, match.index));
        const groupIndex = match.slice(1).findIndex(Boolean);
        result += `<span class="${colorClasses[groupIndex]}">${escapeHtml(match[0])}</span>`;
        offset = match.index + match[0].length;
      }
      return result + escapeHtml(code.slice(offset));
    };

    const updateHighlight = () => {
      highlight.innerHTML = `${colorCode(editor.value)}\n`;
      highlight.scrollTop = editor.scrollTop;
      highlight.scrollLeft = editor.scrollLeft;
    };

    endpoint.value = localStorage.getItem("runner-endpoint") || endpoint.value;
    editor.value = localStorage.getItem("runner-code") || editor.value;
    updateHighlight();

    editor.addEventListener("input", updateHighlight);
    editor.addEventListener("scroll", updateHighlight);
    editor.addEventListener("keydown", event => {
      if (event.key === "Tab") {
        event.preventDefault();
        const start = editor.selectionStart;
        editor.setRangeText("  ", start, editor.selectionEnd, "end");
        updateHighlight();
      }
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
        run();
      }
    });

    async function run() {
      const baseUrl = endpoint.value.trim().replace(/\/$/, "");
      if (!baseUrl) return;

      localStorage.setItem("runner-endpoint", baseUrl);
      localStorage.setItem("runner-code", editor.value);
      runButton.disabled = true;
      output.textContent = "";
      status.className = "";
      status.textContent = "Starting runner and waiting for output…";

      try {
        const response = await fetch(`${baseUrl}/request`, {
          method: "POST",
          body: editor.value
        });
        const body = await response.text();
        if (!response.ok) {
          throw new Error(`Runner returned ${response.status}: ${body}`);
        }

        const result = JSON.parse(body);
        output.textContent = result.response ?? JSON.stringify(result, null, 2);
        status.textContent = "Finished";
      } catch (error) {
        status.className = "error";
        status.textContent = "Run failed";
        output.textContent = error instanceof Error ? error.message : String(error);
      } finally {
        runButton.disabled = false;
      }
    }

    runButton.addEventListener("click", run);
  </script>
</body>
</html>
